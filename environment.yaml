name: biohub_rnaseq
channels:
  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  - python=3.11
  - snakemake=9.*
  - snakemake-executor-plugin-slurm=2.*
  # R + Bioconductor (DEG.R, ETL_gene_info.R)
  - r-base=4.4.*
  - r-tidyverse
  - r-data.table
  - bioconductor-deseq2
  - bioconductor-org.hs.eg.db
  - bioconductor-reactomepa
  # pipeline
  - fastp
  - star=2.7.11b
  - rsem=1.3.3
  - samtools
  - multiqc
  # misc/ e rules de download
  - sra-tools=3.*
  - pigz
  - wget
  # snakemake --dag
  - graphviz

# Perfil SLURM - OPCIONAL. Nao e necessario para rodar o workflow.
# O modo padrao e local (profiles/local). Use este so se quiser submeter:
#
#     snakemake --workflow-profile profiles/slurm
#
# NFS: desde 2026-10-31 os quatro nos montam /mnt/reference (ro) e
# /mnt/shared (rw) pelo fabric. A restricao anterior -- "so o r660xs monta,
# por isso tudo vai para bigmem" -- NAO vale mais.
#
# O que ainda NAO foi validado com um lote real: mover as regras para a
# particao `cpu`. Antes de fazer isso com o L3, rode 2 amostras e confira
# tempo, memoria de pico (sacct MaxRSS) e integridade das contagens.
#
# Particoes em 2026-10-28 (sinfo -s):
#   gpu     r760         64 CPUs   510 GB   limite 7d
#   cpu*    r550-[1-2]   48 CPUs   380 GB   limite 3d
#   bigmem  r660xs      128 CPUs  1003 GB   limite 5d

executor: slurm
jobs: 16
latency-wait: 60

default-resources:
  slurm_partition: "bigmem"
  runtime: 120
  mem_mb: 8000

set-resources:
  build_rsem_index:
    slurm_partition: "bigmem"
  map_reads:
    slurm_partition: "bigmem"

# AGRUPAMENTO POR AMOSTRA
#
# Junta as etapas de uma amostra num unico job SLURM, para que todas rodem no
# MESMO no. E o que permite `output.local_scratch` no config: o FASTQ aparado
# fica no disco de um no, e so faz sentido se quem o le estiver la tambem.
#
# Fica AQUI, e nao como `group:` no Snakefile, de proposito: o Snakefile
# precisa continuar funcionando em maquina sem SLURM, e `group:` no codigo
# afeta tambem a execucao local, onde agrupar costuma REDUZIR paralelismo.
# O `--groups` do profile sobrescreve qualquer definicao do workflow.
#
# As regras de agregacao (run_multiqc, run_deg_analysis, export_results) NAO
# entram: elas leem de todas as amostras e precisam rodar depois de todas.
groups:
  trim_reads: amostra
  map_reads: amostra
  fix_read_group: amostra
  quantify_transcripts: amostra

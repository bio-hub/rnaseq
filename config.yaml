# Configuration for RNA-seq pipeline

reference:
  # Raiz das referencias compartilhadas. Para rodar em outra maquina/caminho,
  # sobrescreva com --configfile config.local.yaml ou --config reference='{dir: ...}'
  dir: "/mnt/reference/rnaseq"
  genome_id: "GRCh38_p14"   # subdiretorio de dir; um por build de genoma
  tax_id: 9606              # filtro de especie no ETL do gene_info
  # true apenas para dry-run em maquina sem a referencia montada
  skip_check: false
  genome_url: "https://ftp.ncbi.nlm.nih.gov/genomes/all/GCF/000/001/405/GCF_000001405.40_GRCh38.p14/GCF_000001405.40_GRCh38.p14_genomic.fna.gz"
  annotation_url: "https://ftp.ncbi.nlm.nih.gov/genomes/all/GCF/000/001/405/GCF_000001405.40_GRCh38.p14/GCF_000001405.40_GRCh38.p14_genomic.gtf.gz"
  gene_info_url: "https://ftp.ncbi.nlm.nih.gov/gene/DATA/gene_info.gz"

star:
  # Comprimento das reads deste projeto, em bp. O workflow deriva
  # sjdbOverhang = read_length - 1, que e o valor que o STAR espera.
  #
  # O mesmo valor vale para o build do indice e para o mapeamento: os dois
  # precisam bater, senao o STAR aborta. Como o overhang entra no nome do
  # diretorio e da sentinela, indices de comprimentos diferentes coexistem:
  #
  #   read_length: 150  ->  rsem_star_sjdb149/  +  .done_sjdb149
  #   read_length: 100  ->  rsem_star_sjdb99/   +  .done_sjdb99
  #
  # Para um projeto de 100 bp, nao edite este arquivo: crie um
  # config.local.yaml com `star: {read_length: 100}` e rode
  # `bash scripts/build_reference.sh` uma vez para gerar o segundo indice.
  read_length: 150
  #
  # Override explicito, opcional. Se presente, tem precedencia sobre
  # read_length. Use para reads de comprimento misto (o maior - 1) ou para
  # reaproveitar um indice construido com outro valor.
  # sjdbOverhang: 149
  #
  limitBAMsortRAM_gb: 30

  # STAR 2-pass. A passada 1 descobre juncoes novas, que sao reinseridas no
  # indice em memoria antes da passada 2. As GATK Best Practices para variant
  # calling em RNA-seq pedem 2-pass: melhora o alinhamento ao redor de juncoes
  # nao anotadas.
  #
  # Default false porque o custo e alto e o alcance, medido nos lotes L1 e L3,
  # e pequeno: so 0,8% a 1,7% das reads unicas apoiam juncoes nao anotadas.
  # Dobra o tempo de map_reads (~11 min -> ~20-23 min na amostra mediana).
  #
  # INCOMPATIVEL com shared_genome: o STAR aborta com "2-pass method is not
  # compatible with --genomeLoad". A guarda em common.smk falha no parse se os
  # dois estiverem ligados, em vez de deixar o lote morrer no meio.
  #
  # Para DEG puro, deixe false: mudar isso remapeia tudo e altera as contagens.
  twopass: false

  # Carrega o genoma uma vez em memoria compartilhada, em vez de uma copia por
  # processo STAR (~32 GB cada). Economiza RAM e o tempo de load.
  #
  # Medido nos 73 Log.final.out do L3: a carga do genoma tem mediana de 24 s
  # (p90 36 s) contra 653 s de mediana do mapeamento -- ~3,5%. O ganho e menor
  # do que este comentario afirmava antes ("~3 min/job"). Entre as duas
  # otimizacoes, twopass vale mais, e elas sao mutuamente exclusivas.
  #
  # Default false porque adiciona modos de falha reais:
  #   - se um job morre, o segmento de shm VAZA e ocupa ~32 GB ate alguem rodar
  #     `ipcrm`; precisa de limpeza no epilog do SLURM
  #   - so um genoma por no de cada vez
  #   - com SLURM multi-no, cada no precisa do proprio load
  # Vale para execucao local; para fila SLURM, mantenha false.
  shared_genome: false

# Onde o workflow escreve. Intermediarios (FASTQ limpos, BAMs) sao volumosos e
# descartaveis: vao para o scratch. So os entregaveis vao para o final_dir.
output:
  project: "rnaseq"
  # Intermediarios. {user} e {project} sao substituidos.
  work_dir: "/mnt/scratch-shared/{user}/{project}"
  # Entregaveis. Relativo ao diretorio de trabalho, ou caminho absoluto.
  final_dir: "results"

  # Disco local do no (Tier 0), para os TEMPORARIOS DE FERRAMENTA (tmp/:
  # _STARtmp do STAR e .rsemtmp do RSEM, ~30 GB por amostra so do RSEM).
  # Saidas declaradas de regra (clean/, mapped/, counts/, logs/, rdata/) ficam
  # SEMPRE no work_dir compartilhado: o Snakemake as confere a partir do no
  # orquestrador, e um arquivo no disco de um compute node nao existe para ele.
  #
  # VAZIO = tudo fica no work_dir. Esse e o padrao e funciona em qualquer
  # maquina, inclusive sem SLURM. Nao preencha aqui: use config.local.yaml.
  #
  # NAO exige agrupamento por amostra. (Ate 2026-10-31 `clean` ficava no disco
  # local e o agrupamento era obrigatorio; `clean` voltou para o work_dir e o
  # profile slurm nao tem mais `groups:` -- commit 968555a.) Um temporario nasce
  # e morre dentro de um job, entao nao cria dependencia entre etapas.
  #
  # CUIDADO no head (r660xs): /scratch/ronald e tmpfs de 300 GB, ou seja, RAM.
  # Use so quando os jobs caem nos workers (cpu/gpu), onde /scratch e disco.
  #
  # Exemplo em config.local.yaml, num cluster com Tier 0:
  #     local_scratch: "/scratch/{user}/{project}"
  local_scratch: ""

  # Quais BAMs exportar para o final_dir:
  #   none  - nenhum; so contagens e relatorios
  #   coord - apenas *_Aligned.sortedByCoord.out.bam (permite variant calling)
  #   all   - inclui o toTranscriptome, que so serve ao RSEM
  keep_bams: "coord"

  # Apaga o work_dir ao fim, SO depois de conferir que os entregaveis chegaram
  # ao final_dir. Ver scripts/cleanup_scratch.sh.
  #
  # ATENCAO: a limpeza roda no no do ORQUESTRADOR e so alcanca o work_dir. Com
  # local_scratch preenchido, o que ficou no disco de cada no NAO e removido
  # por aqui -- quem limpa e o epilog do SLURM, por no. Em execucao local, com
  # local_scratch vazio, nao ha assimetria.
  cleanup_scratch: true

# O STAR grava o read group no alinhamento, mas BAMs de versoes antigas do
# workflow saem com @RG malformado (um unico campo ID:, sem SM: nem PL:).
# MarkDuplicates e BQSR do pipeline de variant calling exigem SM e PL.
# Esta etapa reescreve o header com samtools addreplacerg: barato, nao realinha.
fix_read_group: true

# Threads e memoria por rule. Sem auto-deteccao: o valor nao pode depender
# da maquina que faz o parse do Snakefile (ela nao e a que executa o job).
threads:
  build_index: 20
  trim: 8
  map: 16
  quantify: 12
  fix_rg: 4
  deg: 4
mem_mb:
  build_index: 64000
  trim: 8000
  map: 70000      # genoma STAR ~30 GB + sort 30 GB + folga
  quantify: 16000
  fix_rg: 8000
  deg: 32000
runtime_min:      # usado apenas pelo executor slurm
  build_index: 480
  map: 240
  trim: 120
  quantify: 120
  fix_rg: 120
  deg: 120

deg_analysis:
  enabled: true
  # Dado do PROJETO (nao e referencia compartilhada), relativo ao workdir
  experiment_design_path: "metadata/exp_design.csv"
  alpha: 0.05
  lfc_threshold: 1
